<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Koppen_Street</title>

    <script src="https://cdn.tailwindcss.com"></script>

    <style>
        /* Video Background */
        .video-bg {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -2;
        }

        /* Lapisan gelap agar tulisan terlihat */
        .overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.45);
            z-index: -1;
        }

        /* Isi website */
        .content {
            position: relative;
            z-index: 1;
        }
    </style>
</head>

<body>

    <!-- VIDEO BACKGROUND -->
    <video class="video-bg" autoplay muted loop playsinline>
        <source src="bak mimpi.mp4" type="video/mp4">
        Browser kamu tidak mendukung video.
    </video>

    <!-- OVERLAY -->
    <div class="overlay"></div>


    <!-- NAVBAR -->
    <header class="p-5 shadow bg-white/80 backdrop-blur-sm">
        <div class="flex justify-between items-center max-w-6xl mx-auto">

            <h1 class="text-2xl font-bold">
                ☕ Koppen_Street
            </h1>

            <nav class="flex gap-6">
                <a href="menu.html" class="hover:text-blue-600">
                    Menu
                </a>

                <a href="kelompok RIF.html" class="hover:text-blue-600">
                    Tentang Kami
                </a>

                <a href="Alamat.html" class="hover:text-blue-600">
                    Kontak
                </a>
            </nav>

        </div>
    </header>


    <!-- ISI -->
    <main class="content text-center py-40 text-white">

        <h2 class="text-5xl font-bold mb-5 drop-shadow-lg">
            Selamat Datang di Koppen_Street
        </h2>

        <p class="text-lg mb-8 drop-shadow-lg">
            Kopi jalanan dengan rasa nikmat, harga bersahabat,
            dan suasana yang nyaman.
        </p>

        <a
            href="menu.html"
            class="inline-block bg-black text-white px-8 py-4 rounded-full
                   hover:bg-gray-800 transition duration-300 shadow-lg">
            Lihat Menu
        </a>

    </main>

</body>
</html>
